{% extends "base.html" %}

{% block title %}
{{producto.nombre}}
{% endblock %}

{% block content %}

<h1>{{producto.nombre}}</h1>
<h2>{{producto.precio}}</h2>
{% if producto.imagen %}
<img src="{{url_for('static', filename='img/uploads/' + producto.imagen)}}" alt="{{producto.nombre}}" width="100">
{% else %}
<h3>No imagen</h3>
{% endif %}

{% endblock %}
